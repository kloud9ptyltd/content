class App{
  constructor(){

    this.nodes=NODES.map(n=>{const region=regionFix[n.region]||n.region;
      const a=angles[region]??0,rad=180+Math.random()*160,ja=(Math.random()-0.5)*0.9;
      return {...n,region,x:W/2+Math.cos(a+ja)*rad,y:H/2+Math.sin(a+ja)*rad,vx:0,vy:0,deg:0,r:8,h:0,
        f1:0.14+Math.random()*0.26,p1:Math.random()*6.28,f2:0.11+Math.random()*0.22,p2:Math.random()*6.28};});
    this.byId={}; this.nodes.forEach(n=>this.byId[n.id]=n);
    this.links=LINKS.map(l=>({...l,sn:this.byId[l.s],tn:this.byId[l.t]})).filter(l=>l.sn&&l.tn);
    this.links.forEach(l=>{l.sn.deg++;l.tn.deg++;});
    this.nodes.forEach(n=>{n.r=(n.tier===1?24:n.tier===2?16:12)+Math.min(n.deg*1.3,26);});
    this.centroids={}; REGIONS.forEach(r=>{const a=angles[r]; this.centroids[r]={x:W/2+Math.cos(a)*260,y:H/2+Math.sin(a)*260};});
    this.alpha=1; this.t0=performance.now();
    for(let i=0;i<500;i++) this.step(1/60,true);
    this.snapHomes(); this.alpha=0;               // settle the layout, then freeze the force sim
    this.setupCanvas(); this.fitNow(false); this.bindUI(); this.renderUI(); this.loop();
  }
  step(dt,warm){

    const alpha=warm?this.alpha:Math.max(0.004,this.alpha*0.985); this.alpha=alpha;
    const time=(performance.now()-this.t0)/1000;
    for(const l of ls){const a=l.sn,b=l.tn; let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      const L=30+(a.r+b.r)*1.1,f=(d-L)/d*0.015*alpha*2; dx*=f;dy*=f;
      const wa=b.deg/(a.deg+b.deg),wb=1-wa; a.vx+=dx*wa;a.vy+=dy*wa;b.vx-=dx*wb;b.vy-=dy*wb;}
    for(let i=0;i<ns.length;i++){const a=ns[i];
      for(let j=i+1;j<ns.length;j++){const b=ns[j];let dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy;
        if(d2<1){dx=(Math.random()-0.5);dy=(Math.random()-0.5);d2=1;} if(d2>40000)continue;
        const d=Math.sqrt(d2);let f=-700*alpha/d2;const minD=a.r+b.r+6; if(d<minD)f-=(minD-d)*0.16/d;
        dx*=f;dy*=f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy;}}

    for(const n of ns){const c=this.centroids[n.region]||{x:cx,y:cy};
      n.vx+=(c.x-n.x)*0.011*alpha+(cx-n.x)*0.010*alpha; n.vy+=(c.y-n.y)*0.011*alpha+(cy-n.y)*0.010*alpha;
      if(!warm&&m>0){n.vx+=Math.sin(time*n.f1+n.p1)*0.022*m; n.vy+=Math.cos(time*n.f2+n.p2)*0.022*m;}
      if(n===this.dragN){n.vx=0;n.vy=0;continue;} n.vx*=0.90;n.vy*=0.90;n.x+=n.vx;n.y+=n.vy;}
  }
  /* smooth drift: each node floats on a slow sine around its settled home — no force feedback, so no jitter */
  snapHomes(){const time=(performance.now()-this.t0)/1000;
    for(const n of this.nodes){ if(n.amp==null)n.amp=3+Math.random()*4;
      n.hx=n.x-Math.sin(time*n.f1+n.p1)*n.amp; n.hy=n.y-Math.cos(time*n.f2+n.p2)*n.amp; }}

      this.tf={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,k:f.k+(t.k-f.k)*e}; if(p>=1)this.anim=null;} this.draw();};
  nodeColor(n){const cb=this.state.colorBy; if(cb==='type')return TCOLOR[n.type]||'#666'; if(cb==='tier')return TIERC[n.tier]; return RCOLOR[n.region]||'#8a857f';}
  nodeVisible(n){const o=this.state.off; return !o['r:'+n.region]&&!o['t:'+n.type]&&!o['tier:'+n.tier];}
  linkVisible(l){return this.nodeVisible(l.sn)&&this.nodeVisible(l.tn)&&!this.state.off['c:'+l.c];}
  draw(){
    const cv=this.canvas,ctx=this.ctx,dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#f1ece2'; ctx.fillRect(0,0,w,h);
    const tf=this.tf; ctx.setTransform(dpr*tf.k,0,0,dpr*tf.k,dpr*tf.x,dpr*tf.y);
    const bn=this.state.mode==='bn';
    const focus=this.hoverN||(this.state.sel?this.byId[this.state.sel]:null);
    let nbr=null; if(focus){nbr=new Set([focus.id]); this.links.forEach(l=>{if(l.s===focus.id)nbr.add(l.t); if(l.t===focus.id)nbr.add(l.s);});}
    for(const l of this.links){ if(!this.linkVisible(l))continue; const a=l.sn,b=l.tn;
      const dim=nbr&&!(l.s===focus.id||l.t===focus.id); let col,alpha,lw;
      if(bn){col=CCOLOR[l.c];alpha=l.c==='std'?0.10:(dim?0.25:0.8);lw=l.c==='sole'?2.2:l.c==='near'?1.6:1;}
      else{col=this.nodeColor(a);alpha=dim?0.04:0.22;lw=1;if(nbr&&!dim){alpha=0.9;lw=1.8;}}
      const ang=Math.atan2(b.y-a.y,b.x-a.x); const ax=a.x+Math.cos(ang)*(a.r+2),ay=a.y+Math.sin(ang)*(a.r+2);
      const bx=b.x-Math.cos(ang)*(b.r+4),by=b.y-Math.sin(ang)*(b.r+4);

      if(EDGE_ARROWS&&(!nbr||!dim)){const s=Math.min(Math.max(6/tf.k,(b.r+4)*0.4),b.r+6);
        ctx.globalAlpha=Math.min(1,alpha+0.3); ctx.beginPath();ctx.moveTo(bx,by);
        ctx.lineTo(bx-Math.cos(ang-0.38)*s,by-Math.sin(ang-0.38)*s);

        ctx.closePath();ctx.fillStyle=col;ctx.fill();}}
    const bnNodes=bn?new Set(this.links.filter(l=>l.c==='sole'||l.c==='near').flatMap(l=>[l.s,l.t])):null;
    for(const n of this.nodes){ if(!this.nodeVisible(n))continue;
      const dim=nbr?!nbr.has(n.id):(bn&&!bnNodes.has(n.id));
      const ht=(this.hoverN===n||this.state.sel===n.id)?1:0; n.h+=(ht-n.h)*0.15;
      const r=n.r*(1+0.18*n.h),col=this.nodeColor(n); ctx.globalAlpha=dim?0.14:1;

        ctx.globalAlpha=dim?0.14:1;}
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.284);ctx.fill();
      ctx.strokeStyle='#fdfcfa';ctx.lineWidth=Math.max(3.2/tf.k,r*0.09);ctx.stroke();
      if(this.state.sel===n.id){ctx.strokeStyle='#201e1d';ctx.lineWidth=2/tf.k;ctx.beginPath();ctx.arc(n.x,n.y,r+5/tf.k,0,6.284);ctx.stroke();}
      else if(bn&&bnNodes.has(n.id)&&!nbr){ctx.globalAlpha=0.7;ctx.strokeStyle='#d6006c';ctx.lineWidth=1.1/tf.k;ctx.beginPath();ctx.arc(n.x,n.y,r+3/tf.k,0,6.284);ctx.stroke();}}
    const thr=LABEL_DENSITY==='dense'?18:LABEL_DENSITY==='sparse'?42:30; ctx.textAlign='center';
    for(const n of this.nodes){ if(!this.nodeVisible(n))continue; const dim=nbr?!nbr.has(n.id):false;
      const show=(!dim)&&(n.r*tf.k>=thr||n.h>0.05||(nbr&&nbr.has(n.id))||this.state.sel===n.id); if(!show)continue;

      ctx.strokeStyle='rgba(241,236,226,0.85)';ctx.lineWidth=4/tf.k; const ly=n.y-n.r-Math.max(7/tf.k,4);
      ctx.strokeText(n.name,n.x,ly);ctx.fillStyle='#201e1d';ctx.fillText(n.name,n.x,ly);}

  setupCanvas(){
    const el=$('#cv'); this.canvas=el; this.ctx=el.getContext('2d');
    const md=(e)=>{const p=this.toWorld(e),n=this.hit(p); this.pd={x:e.clientX,y:e.clientY,moved:false,node:n,tf0:{...this.tf}}; if(n){this.dragN=n;this.forceSettle=true;this.alpha=Math.max(this.alpha,0.35);} el.style.cursor='grabbing'; e.preventDefault();};
    const mm=(e)=>{ if(this.pd){const dx=e.clientX-this.pd.x,dy=e.clientY-this.pd.y; if(Math.abs(dx)+Math.abs(dy)>4)this.pd.moved=true;
        if(this.dragN){const p=this.toWorld(e);this.dragN.x=p.x;this.dragN.y=p.y;this.alpha=Math.max(this.alpha,0.35);}
        else{this.tf={x:this.pd.tf0.x+dx,y:this.pd.tf0.y+dy,k:this.pd.tf0.k};}}
      else{const p=this.toWorld(e),n=this.hit(p); if(n!==this.hoverN){this.hoverN=n;el.style.cursor=n?'pointer':'grab';}}};
    const mu=(e)=>{ if(this.pd&&!this.pd.moved){const n=this.pd.node; this.setState({sel:n?n.id:null,q:'',results:[]}); $('#search').value='';}
      if(this.dragN)this.alpha=Math.max(this.alpha,0.5); this.dragN=null;this.pd=null;el.style.cursor='grab';};
    const wh=(e)=>{e.preventDefault();const rect=el.getBoundingClientRect();const px=e.clientX-rect.left,py=e.clientY-rect.top;
      const k2=Math.min(8,Math.max(0.15,this.tf.k*Math.exp(-e.deltaY*0.0016))),f=k2/this.tf.k; this.anim=null;
      this.tf={x:px-(px-this.tf.x)*f,y:py-(py-this.tf.y)*f,k:k2};};
    el.addEventListener('mousedown',md); el.addEventListener('wheel',wh,{passive:false});
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
    el.style.cursor='grab'; new ResizeObserver(()=>{if(this.nodes)this.fitNow(false);}).observe(el);
  }
  toWorld(e){const r=this.canvas.getBoundingClientRect(); return {x:(e.clientX-r.left-this.tf.x)/this.tf.k,y:(e.clientY-r.top-this.tf.y)/this.tf.k};}
  hit(p){let best=null,bd=1e9; for(const n of this.nodes){if(!this.nodeVisible(n))continue;const d=Math.hypot(p.x-n.x,p.y-n.y);if(d<n.r+5/this.tf.k&&d<bd){best=n;bd=d;}} return best;}

  centerOn(n){const w=this.canvas.clientWidth,h=this.canvas.clientHeight,k=Math.max(this.tf.k,1.6);
    this.anim={from:{...this.tf},to:{k,x:w/2-k*n.x,y:h/2-k*n.y},start:performance.now(),dur:600};}
  zoomBy(f){const w=this.canvas.clientWidth,h=this.canvas.clientHeight,k2=Math.min(8,Math.max(0.15,this.tf.k*f)),g=k2/this.tf.k;
    this.anim={from:{...this.tf},to:{k:k2,x:w/2-(w/2-this.tf.x)*g,y:h/2-(h/2-this.tf.y)*g},start:performance.now(),dur:250};}
  setState(patch){Object.assign(this.state,patch); this.renderUI();}
  toggle(key){const off={...this.state.off}; off[key]=!off[key]; this.setState({off});}
  resetGroup(prefix){const off={...this.state.off}; Object.keys(off).forEach(k=>{if(k.startsWith(prefix))delete off[k];}); this.setState({off});}
  bindUI(){
    $('#tabGraph').onclick=()=>this.setState({mode:'graph'});
    $('#tabBn').onclick=()=>this.setState({mode:'bn',sel:null});
    $('#colorby').onchange=e=>this.setState({colorBy:e.target.value});
    $('#zin').onclick=()=>this.zoomBy(1.45); $('#zout').onclick=()=>this.zoomBy(1/1.45); $('#fit').onclick=()=>this.fitNow(true);
    document.querySelectorAll('button.all').forEach(b=>b.onclick=()=>this.resetGroup(b.dataset.reset));
    $('#search').oninput=e=>{const q=e.target.value,ql=q.toLowerCase();
      this.setState({q,results:q?this.nodes.filter(n=>n.name.toLowerCase().includes(ql)||String(n.ticker).toLowerCase().includes(ql)).slice(0,7):[]});};
    const grp=(cid,items)=>{$(cid).innerHTML=items.map(it=>
      `<div class="row" data-key="${it.key}"><span class="${it.dash?'dash':'dot'}" style="background:${it.color}"></span><span class="nm">${esc(it.label)}</span><span class="cnt">${it.count}</span></div>`).join('');};
    grp('#f-region',REGIONS.map(r=>({key:'r:'+r,label:r,color:RCOLOR[r],count:this.nodes.filter(n=>n.region===r).length})));
    grp('#f-type',TYPES.map(t=>({key:'t:'+t,label:t,color:TCOLOR[t],count:this.nodes.filter(n=>n.type===t).length})));
    grp('#f-tier',[1,2,3].map(t=>({key:'tier:'+t,label:'Tier '+t,color:TIERC[t],count:this.nodes.filter(n=>n.tier===t).length})));
    grp('#f-crit',CRITS.map(([c,l])=>({key:'c:'+c,label:l,color:CCOLOR[c],dash:1,count:this.links.filter(x=>x.c===c).length})));
    document.querySelectorAll('aside .row').forEach(row=>row.onclick=()=>this.toggle(row.dataset.key));
  }
  renderUI(){
    const s=this.state;
    $('#tabGraph').classList.toggle('on',s.mode==='graph'); $('#tabBn').classList.toggle('on',s.mode==='bn');
    document.querySelectorAll('aside .row').forEach(row=>row.classList.toggle('off',!!s.off[row.dataset.key]));
    const visN=this.nodes.filter(n=>this.nodeVisible(n)),visL=this.links.filter(l=>this.linkVisible(l));
    $('#statNodes').textContent=visN.length; $('#statLinks').textContent=visL.length;
    $('#statBn').textContent=visL.filter(l=>l.c==='sole'||l.c==='near').length;
    const rz=$('#results'); if(s.results&&s.results.length){rz.classList.remove('hidden');
      rz.innerHTML=s.results.map(n=>`<div class="r" data-id="${n.id}"><b>${esc(n.name)}</b><span>${esc(n.ticker)}</span></div>`).join('');
      rz.querySelectorAll('.r').forEach(r=>r.onclick=()=>{const n=this.byId[r.dataset.id]; this.setState({sel:n.id,q:'',results:[]}); $('#search').value=''; this.centerOn(n);});
    } else rz.classList.add('hidden');
    const p=$('#panel'), sel=s.sel?this.byId[s.sel]:null;
    if(sel){const critTag=c=>`font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:${c==='std'?'var(--n400)':CCOLOR[c]}`;
      const rel=(l,other,dir)=>`<div class="rel" data-id="${other.id}"><div class="r1"><span class="arr">${dir==='out'?'→':'←'}</span><span class="rn">${esc(other.name)}</span><span class="crit" style="${critTag(l.c)}">${CRITLABEL[l.c]}</span></div><div class="rl">${esc(l.label)}</div></div>`;
      const supplies=this.links.filter(l=>l.s===sel.id).map(l=>rel(l,l.tn,'out'));
      const suppliers=this.links.filter(l=>l.t===sel.id).map(l=>rel(l,l.sn,'in'));
      p.innerHTML=`<div class="phead"><div><div class="pname">${esc(sel.name)}</div><div class="ptk">${esc(sel.ticker)}</div></div><button class="x">×</button></div>
        <div class="tags"><span class="tag" style="background:${RCOLOR[sel.region]}1a;color:${RCOLOR[sel.region]};font-weight:600">${esc(sel.region)}</span><span class="tag">${esc(sel.type)}</span><span class="tag">Tier ${sel.tier}</span></div>
        <div class="sect">Role</div><div class="role">${esc(sel.role)}</div>
        <div class="sect">Description</div><div class="desc">${esc(sel.desc)}</div>
        ${supplies.length?`<div class="sect">Supplies (${supplies.length})</div>${supplies.join('')}`:''}
        ${suppliers.length?`<div class="sect">Supplied by (${suppliers.length})</div>${suppliers.join('')}`:''}`;
      p.classList.remove('hidden');
      p.querySelector('.x').onclick=()=>this.setState({sel:null});
      p.querySelectorAll('.rel').forEach(r=>r.onclick=()=>{const n=this.byId[r.dataset.id]; this.setState({sel:n.id}); this.centerOn(n);});
    } else p.classList.add('hidden');
    const bp=$('#bnpanel');
    if(s.mode==='bn'&&!sel){
      const bnList=this.links.filter(l=>l.c==='sole'||l.c==='near').sort((a,b)=>(a.c==='sole'?0:1)-(b.c==='sole'?0:1));
      bp.innerHTML=`<div class="bhead">Bottlenecks</div><div class="bsub">Sole-source and near-monopoly links — the places where the whole chain narrows to one or two suppliers.</div>`+
        bnList.map(l=>`<div class="bn" data-id="${l.s}"><div class="b1"><b>${esc(l.sn.name)}</b><span class="arr" style="color:var(--n400)">→</span><b>${esc(l.tn.name)}</b></div><div class="b2"><span class="bl">${esc(l.label)}</span><span class="crit" style="color:${CCOLOR[l.c]}">${l.c==='sole'?'Sole source':'Near monopoly'}</span></div></div>`).join('');
      bp.classList.remove('hidden');
      bp.querySelectorAll('.bn').forEach(r=>r.onclick=()=>{const n=this.byId[r.dataset.id]; this.setState({sel:n.id}); this.centerOn(n);});
    } else bp.classList.add('hidden');
  }
}
document.fonts&&document.fonts.ready?document.fonts.ready.then(()=>{window.__app=new App();}):window.addEventListener('load',()=>{window.__app=new App();});
</script>
</body></html>
